[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "google-health-claude"
version = "0.1.0"
description = "Pull your own Google Health (Fitbit) data into a git repo so Claude can analyse it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
auth = ["google-auth-oauthlib>=1.2"]
dev = ["pytest>=8", "google-auth-oauthlib>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
